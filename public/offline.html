<!DOCTYPE html>
<html lang="id">
<head>
<!-- hz-bare: halaman mandiri untuk service worker (tanpa header/footer/menu). build.js tidak menyisipkan apa pun ke halaman bertanda ini. -->
<meta charset="UTF-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Kamu sedang offline — Henz MLBB</title>
<script>try{if(localStorage.getItem("hz_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<style>
  :root{color-scheme:light;--bg:#fff;--card:#f8f8f8;--line:#e8e8e8;--text:#111;--sub:#666}
  html[data-theme="dark"]{color-scheme:dark;--bg:#121212;--card:#1c1c1f;--line:#3a3a40;--text:#f1f1f3;--sub:#a1a1aa}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .box{width:100%;max-width:380px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 24px}
  .ico{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;background:#e53232;display:flex;align-items:center;justify-content:center}
  .ico svg{width:34px;height:34px}
  h1{margin:0 0 8px;font-size:20px;line-height:1.3}
  p{margin:0 0 20px;font-size:14px;line-height:1.6;color:var(--sub)}
  button{width:100%;min-height:48px;border:0;border-radius:12px;background:#e53232;color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  button:active{transform:scale(.98)}
  button:focus-visible{outline:3px solid #FFC200;outline-offset:2px}
</style>
</head>
<body>
  <main class="box">
    <div class="ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><line x1="12" y1="20" x2="12.01" y2="20"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
    </div>
    <h1>Kamu sedang offline</h1>
    <p>Halaman ini belum tersimpan di perangkatmu dan butuh koneksi internet. Periksa jaringanmu lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
