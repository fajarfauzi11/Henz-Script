<!doctype html>
<html lang="{{lang}}">
<head>
{{> head}}
</head>
<body>
{{> header}}
<main id="main" class="container article-main" data-view-slug="{{viewSlug}}"{{{popularAttr}}}>
{{> breadcrumb}}
<header class="article-head">
  <h1 class="article-title" data-pagefind-meta="title">{{articleTitle}}</h1>
  <p class="article-meta">
{{{metaHtml}}}
  </p>
</header>
<div class="article-layout{{{layoutClass}}}">
  <div class="article-col">
    <article class="article" data-pagefind-body>
      <figure class="article-figure">
        {{{thumbHtml}}}
        <figcaption class="article-credit" data-pagefind-ignore>Image credit: {{thumbCredit}}</figcaption>
      </figure>
  {{{shareTop}}}
{{{bodyBefore}}}
{{{readAlsoInline}}}
{{{bodyAfter}}}
  {{{shareBottom}}}
{{{commentsSlot}}}
  {{{tagsHtml}}}
    </article>
{{{readAlsoBottom}}}
{{{relatedHtml}}}
  </div>
  {{{asideHtml}}}
</div>
</main>
{{> footer}}
</body>
</html>
