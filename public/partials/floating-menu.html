<!-- Floating Menu (Pengaturan) — disisipkan otomatis oleh build.js sebelum tag penutup body di SEMUA halaman.
     Logika: public/js/floating-menu.js (ikut digabung ke dist/js/app.js). Gaya: bagian "Floating Menu" di style.css.
     Baris baru (Night Mode, Bahasa) nanti cukup ditambah sebagai <button class="hz-fm-item"> di dalam #hz-fm-panel. -->
<div class="hz-fm" id="hz-fm-root">
  <div class="hz-fm-panel" id="hz-fm-panel" role="group" aria-label="Menu pengaturan">
    <div class="hz-fm-panel-title">Pengaturan</div>
    <button type="button" class="hz-fm-item" id="hz-fm-open-history">
      <span class="hz-fm-item-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/><polyline points="12 7 12 12 15.5 14"/></svg></span>
      <span class="hz-fm-item-label">Riwayat Script</span>
      <svg class="hz-fm-item-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <button type="button" class="hz-fm-btn" id="hz-fm-btn" aria-label="Buka menu pengaturan" aria-expanded="false" aria-controls="hz-fm-panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>
<div class="hz-fm-overlay" id="hz-fm-history" role="dialog" aria-modal="true" aria-labelledby="hz-fm-history-title" aria-hidden="true">
  <div class="hz-fm-modal">
    <button type="button" class="hz-fm-close" id="hz-fm-history-close" aria-label="Tutup riwayat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
    <h2 class="hz-fm-modal-title" id="hz-fm-history-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/><polyline points="12 7 12 12 15.5 14"/></svg>
      Riwayat Script yang Dibuka
    </h2>
    <p class="hz-fm-modal-sub">Script yang pernah kamu buka di perangkat/browser ini.</p>
    <div class="hz-fm-list" id="hz-fm-history-list"></div>
    <div class="hz-fm-modal-foot" id="hz-fm-history-foot">
      <button type="button" class="hz-fm-clear" id="hz-fm-clear-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        Hapus Riwayat
      </button>
      <div class="hz-fm-confirm" id="hz-fm-confirm">
        <span class="hz-fm-confirm-text">Hapus semua riwayat di perangkat ini?</span>
        <span class="hz-fm-confirm-btns">
          <button type="button" class="hz-fm-cancel" id="hz-fm-cancel-btn">Batal</button>
          <button type="button" class="hz-fm-confirm-yes" id="hz-fm-confirm-btn">Ya, Hapus</button>
        </span>
      </div>
    </div>
  </div>
</div>
