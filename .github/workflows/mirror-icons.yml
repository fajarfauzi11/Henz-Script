# Cadangkan ikon skill/hero (static.wikia.nocookie.net) ke repo ikon "Henz-Script-icons" yang disajikan jsDelivr.
# Dipicu: manual (tombol "Run workflow") dan otomatis tiap push yang mengubah public/data/posts/**.
# Hasil: ikon baru di-commit ke repo ikon, lalu tool/skill-icons-map.json di repo ini diperbarui -> Vercel deploy ulang
# -> build.js mengalihkan <img> ikon ke jsDelivr (dengan fallback otomatis ke wikia bila CDN gagal).
# Syarat satu kali: repo publik "Henz-Script-icons" (dengan 1 commit awal, mis. README) + secret repo ICONS_REPO_TOKEN
# (fine-grained token, akses HANYA ke repo ikon, izin Contents: Read and write).
name: Cadangkan ikon skill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/data/posts/**'

concurrency:
  group: mirror-icons
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Periksa secret
        env:
          ICONS_REPO_TOKEN: ${{ secrets.ICONS_REPO_TOKEN }}
        run: |
          if [ -z "${ICONS_REPO_TOKEN:-}" ]; then
            echo "Secret ICONS_REPO_TOKEN belum diatur di repo ini (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Ambil repo utama
        uses: actions/checkout@v4
        with:
          path: main

      - name: Ambil repo ikon
        uses: actions/checkout@v4
        with:
          repository: fajarfauzi11/Henz-Script-icons
          path: icons
          token: ${{ secrets.ICONS_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unduh ikon yang belum ada dan susun peta
        run: node main/tool/mirror-skill-icons.js --posts main/public/data/posts --out icons --map main/tool/skill-icons-map.json

      - name: Simpan ikon ke repo ikon
        working-directory: icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada ikon baru."
          else
            git commit -m "Tambah ikon skill (otomatis)"
            git pull --rebase || true
            git push
          fi

      - name: Simpan peta ke repo utama
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool/skill-icons-map.json
          if git diff --cached --quiet; then
            echo "Peta tidak berubah."
          else
            git commit -m "Perbarui peta ikon skill (otomatis)"
            git pull --rebase origin main
            git push
          fi
